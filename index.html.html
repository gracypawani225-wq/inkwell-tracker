<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkwell – focus, study &amp; life tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=DM+Sans:wght@400;600;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2FC;--s:#fff;--s2:#ECE8F8;--ink:#1E1B2E;--mute:#6B6785;--a:#6D4AFF;--a2:#D9772B;--bad:#D6453D;--line:#E0DBF2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100E19;--s:#1A1727;--s2:#252136;--ink:#F0EDFA;--mute:#A29DBF;--a:#C8B6FF;--a2:#FFC49B;--bad:#FF8A8A;--line:#2D2842;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100E19;--s:#1A1727;--s2:#252136;--ink:#F0EDFA;--mute:#A29DBF;--a:#C8B6FF;--a2:#FFC49B;--bad:#FF8A8A;--line:#2D2842;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'DM Sans',system-ui,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font:400 2.5rem 'Pinyon Script',cursive;color:var(--a);margin:0 0 14px 8px;line-height:1}
aside button.nv{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;color:var(--mute);font-weight:600}
aside button.nv:hover{background:var(--s2)}aside button.nv.on{background:var(--a);color:var(--bg)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--mute);padding:8px}
main{padding:26px clamp(14px,4vw,40px) 60px;max-width:1100px;width:100%}
h2{font:800 1.7rem 'DM Sans';margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.cal{font:400 2rem 'Pinyon Script',cursive;color:var(--a);margin:0 0 2px;line-height:1.25}
.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:800 1.7rem 'DM Sans';font-variant-numeric:tabular-nums}.stat span{color:var(--mute);font-size:.82rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input.g{flex:1 1 140px}
.btn{font:700 .92rem 'DM Sans';border:0;border-radius:10px;background:var(--a);color:var(--bg);padding:10px 16px;cursor:pointer}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.chip{border:1.5px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:5px 12px;font:600 .85rem 'DM Sans';cursor:pointer}
.chip.on{border-color:var(--a);color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
ul{list-style:none;margin:8px 0 0;padding:0}
li.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}li.it:last-child{border:0}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--a);background:none;cursor:pointer;padding:0;display:grid;place-items:center}
.chk svg{width:16px;height:16px;fill:none;stroke:var(--bg);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.done .chk{background:var(--a)}.done .chk svg{stroke-dashoffset:0}
.done .tt{color:var(--mute);text-decoration:line-through}.tt{flex:1;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--mute);font-size:1.25rem;cursor:pointer}
.tag{font-size:.75rem;color:var(--a2);font-weight:700}.mt{color:var(--mute);font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:10px}
.bars i{flex:1;background:var(--a);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}.bars i.z{background:var(--line)}
.meter{height:9px;background:var(--s2);border-radius:9px;overflow:hidden;flex:1}.meter i{display:block;height:100%;background:var(--a2)}
.rw{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.9rem}.rw span:first-child{width:90px}.rw span:last-child{width:70px;text-align:right}
.warn{color:var(--bad);font-weight:700}
#ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px}
#ov.on{display:grid}.clock{font:800 clamp(4rem,18vw,9rem)/1 'DM Sans';font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.say{font:italic 500 clamp(1.3rem,4vw,1.9rem)/1.35 Fraunces,Georgia,serif;color:var(--a);max-width:560px;margin:14px auto}
.pledge{max-width:440px;text-align:left}.pledge label{display:flex;gap:10px;margin:12px 0;font-weight:600}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--a2);color:#0B1020;font-weight:800;padding:12px 20px;border-radius:14px;max-width:92vw;display:none;box-shadow:0 8px 30px #0006}
@media(max-width:780px){.app{display:block}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-right:0;background:var(--s);z-index:20;gap:2px}
.logo,.side-foot{display:none}aside button.nv{white-space:nowrap;padding:9px 12px}main{padding-bottom:90px}:root{padding-bottom:0}}
body{background:radial-gradient(900px 420px at 85% -8%,color-mix(in srgb,var(--a) 15%,transparent),transparent),radial-gradient(700px 400px at -5% 105%,color-mix(in srgb,var(--a2) 10%,transparent),transparent),var(--bg)}
.lv{font:800 1.4rem 'DM Sans';background:var(--a);color:var(--bg);border-radius:12px;padding:6px 14px}.flame{font:800 1.2rem 'DM Sans'}
.cf{position:fixed;z-index:70;pointer-events:none;width:9px;height:9px;border-radius:2px;animation:cf 1.1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.orb{width:150px;height:150px;border-radius:50%;margin:20px auto;background:radial-gradient(circle,var(--a),color-mix(in srgb,var(--a) 20%,transparent));animation:br 8s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.dt{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;font:700 .7rem 'DM Sans';color:var(--mute)}.dt.on{background:var(--a);border-color:var(--a);color:var(--bg)}
#caught{position:fixed;inset:0;z-index:80;background:#000a;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}.cbox{background:var(--s);border:2px solid var(--a2);border-radius:22px;padding:26px;max-width:420px;text-align:center;animation:pp .35s}@keyframes pp{from{transform:scale(.7);opacity:0}}
body{background:radial-gradient(700px 500px at 90% -10%,color-mix(in srgb,var(--a) 22%,transparent),transparent),radial-gradient(600px 500px at -10% 40%,color-mix(in srgb,var(--a2) 14%,transparent),transparent),radial-gradient(800px 500px at 60% 112%,color-mix(in srgb,var(--a) 14%,transparent),transparent),var(--bg);background-attachment:fixed}
.card,.stat{background:color-mix(in srgb,var(--s) 78%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--ink) 9%,transparent);border-radius:24px;box-shadow:0 18px 40px -28px #000a}.card{padding:20px}
h2,.stat b,.clock,.lv,.flame{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}h2{font-size:2.5rem;line-height:1.1}.logo{font-size:3.1rem}
.btn{border-radius:999px;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,var(--a2)));box-shadow:0 10px 24px -12px var(--a)}.btn.ghost{background:none;box-shadow:none}.btn:hover{filter:brightness(1.1)}
input,select{border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,var(--s2))}
aside button.nv{border-radius:14px}aside button.nv.on{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,var(--a2)));box-shadow:0 10px 22px -12px var(--a)}
.meter{height:11px}.meter i{background:linear-gradient(90deg,var(--a),var(--a2))}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:330px}.heat i{aspect-ratio:1;border-radius:9px}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 40% at 20% 30%,color-mix(in srgb,var(--a) 26%,transparent),transparent),radial-gradient(35% 35% at 80% 20%,color-mix(in srgb,var(--a2) 18%,transparent),transparent),radial-gradient(45% 45% at 60% 85%,color-mix(in srgb,var(--a) 18%,transparent),transparent);filter:blur(40px);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.1)}}
.ringf{width:min(76vw,370px);aspect-ratio:1;margin:12px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--a) var(--p,0%),color-mix(in srgb,var(--s2) 80%,transparent) 0);box-shadow:0 0 90px -24px var(--a)}
.rin{width:calc(100% - 26px);aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center}.rin .clock{font-size:clamp(2.6rem,13vw,5rem)}
#ov{background:radial-gradient(60% 60% at 50% 40%,color-mix(in srgb,var(--a) 16%,transparent),transparent),var(--bg);overflow:auto}
.card:hover,.stat:hover{transform:translateY(-2px)}
.hint{color:var(--mute);font-size:.82rem;margin:0 0 10px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.top h2{margin:0}
.bdgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.bdg{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--s2);font-size:.8rem}.bdg:not(.on){opacity:.4;filter:grayscale(1)}
.card{transition:transform .2s,border-color .2s}.card:hover{border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.cf{display:none}.orb,body::before{animation:none}}
</style></head>
<body>
<div class="app"><aside id="nav"></aside><main id="v"></main></div>
<div id="ov"></div><div id="toast" role="alert"></div>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dk=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=dk(new Date()),CUR='₹',EC=['Food','Travel','Study','Shopping','Bills','Other'],AS=['Applied','Interview','Offer','Rejected'];
const H=m=>(m/60).toFixed(1)+'h',M=n=>CUR+Math.round(n).toLocaleString('en-IN');
const MSG=['Phone down. No Instagram, no YouTube until the timer ends.','One thing only. Stay with this page.','Breathe. Eyes on the work, not the feed.','Future you is grateful. Keep going.','Distraction can wait 25 minutes. Your goals can’t.'];
let S={tasks:[],sess:[],topics:[],subs:['General'],exp:[],trips:[],apps:[],budget:0,xp:0,goal:60,bd:[],q:{},mood:{},habits:[],exams:[],pal:'gold'},tab='today',wk=0,mo=T.slice(0,7),ed=T,F={subj:'General',topic:'',mins:25,markDone:false,run:false},ref=null,st='Saved on this device';
try{Object.assign(S,JSON.parse(localStorage.getItem('inkwell')||'{}'))}catch(e){}
let sv=null;const save=()=>{chk();try{localStorage.setItem('inkwell',JSON.stringify(S))}catch(e){}clearTimeout(sv);if(ref)sv=setTimeout(()=>ref.set(JSON.parse(JSON.stringify(S))).then(()=>{st='Synced to your account';foot()}).catch(()=>{}),600)};
const foot=()=>{const f=$('#sf');if(f)f.textContent=st};
(async()=>{try{const[u,db]=await Promise.all([claude.use('user'),claude.use('db')]);if(!u||!db)return;ref=db.doc('data/users/'+await u.id()+'/app');const s=await ref.get();if(s.exists)Object.assign(S,s.data());else save();st='Synced to your account';render()}catch(e){}})();
const TABS=[['today','🏠 Today'],['focus','🎯 Focus'],['week','🗓 Week plan'],['rewards','🏆 Quests & habits'],['money','🪙 Money'],['travel','🧭 Travel'],['apply','💼 Opportunities'],['month','📊 Month review']];
const tk=(t)=>`<li class="it ${t.done?'done':''}"><button class="chk" data-a="tog" data-id="${t.id}" aria-label="Toggle ${esc(t.t)}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span class="tt">${esc(t.t)}</span>${t.s?`<span class="tag">${esc(t.s)}</span>`:''}<button class="x" data-a="del" data-id="${t.id}" aria-label="Delete">×</button></li>`;
const inp=(id,ph,ty='text',ex='')=>`<input class="g" id="${id}" type="${ty}" placeholder="${ph}" ${ex}>`;
const subSel=(id,v)=>`<select id="${id}" data-ch="${id}">${S.subs.map(s=>`<option ${s===v?'selected':''}>${esc(s)}</option>`).join('')}</select>`;
const sum=a=>a.reduce((x,y)=>x+y,0);
const sessMin=p=>sum(S.sess.filter(x=>x.d.startsWith(p)).map(x=>x.m));
const expSum=p=>sum(S.exp.filter(x=>x.d.startsWith(p)).map(x=>x.a));

function vToday(){const l=S.tasks.filter(t=>t.d===T).sort((a,b)=>a.done-b.done),od=S.tasks.filter(t=>t.d<T&&!t.done),dn=l.filter(t=>t.done).length,hr=new Date().getHours();
return `<div class="top"><div><h2>${hr<12?'Good morning':hr<17?'Good afternoon':'Good evening'}</h2><p class="sub" style="margin:0">${new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'})}</p></div><button class="btn" data-tab="focus">▶ Start a focus session</button></div>
<div class="two"><div>
<div class="grid"><div class="stat"><b>${dn}/${l.length}</b><span>tasks done</span></div><div class="stat"><b>${H(sessMin(T))}</b><span>studied today</span></div><div class="stat"><b>${M(expSum(T))}</b><span>spent today</span></div></div>
<div class="card"><div class="cal">Add a task</div><p class="hint">Type a task and press Enter. Pick a subject to tag it.</p><div class="row">${inp('nt','What needs doing?','text','data-ent="#at" maxlength=120')}${subSel('ns','General')}<button class="btn" id="at" data-a="add">Add</button></div></div>
${od.length?`<div class="card"><div class="cal">Carried over</div><p class="hint">Unfinished tasks from earlier days.</p><ul>${od.map(tk).join('')}</ul><button class="chip" data-a="carry">Move all to today</button></div>`:''}
<div class="card"><div class="cal">Today’s tasks</div><p class="hint">Tick a task to earn 10 XP.</p>${l.length?`<ul>${l.map(tk).join('')}</ul>`:'<p class="mt">Nothing yet. Add your first task above.</p>'}</div>
</div><div>${hero()}${wk7()}</div></div>`}
function vFocus(){const op=S.topics.filter(t=>!t.done&&t.s===F.subj),td=S.sess.filter(x=>x.d===T);
return `<h2>Focus mode</h2><p class="sub">Pick what you’re studying, then lock in.</p>
<div class="card"><div class="row">${subSel('fs',F.subj)}<select id="ft" data-ch="ft"><option value="">Free study</option>${op.map(t=>`<option value="${t.id}" ${t.id===F.topic?'selected':''}>${esc(t.n)}</option>`).join('')}</select></div>
<div class="row" style="margin:12px 0">${[25,45,60,90].map(m=>`<button class="chip ${F.mins===m?'on':''}" data-a="mins" data-m="${m}">${m} min</button>`).join('')}<input id="cm" type="number" min="1" max="300" placeholder="custom" style="width:90px" data-ent="#cb"><button class="chip" id="cb" data-a="cmins">Set</button></div>
<label class="row mt"><input type="checkbox" id="md" ${F.markDone?'checked':''} data-ch="md"> Mark topic complete when I finish</label>
<label class="row mt"><input type="checkbox" id="sm" ${S.strict!==false?'checked':''} data-ch="sm"> Strict mode: leaving the page 3 times voids the session. Time away never counts.</label>
<p><button class="btn" data-a="pledge">Start ${F.mins} min focus</button></p></div>
<div class="two"><div class="card"><div class="cal">Subjects &amp; topics</div><p class="hint">Add what you are studying. Pick a topic before a session and tick it off when you finish it.</p><div class="row">${inp('nsub','New subject','text','data-ent="#asb"')}<button class="btn ghost" id="asb" data-a="addsub">Add</button></div>
<div class="row" style="margin-top:8px">${subSel('tsb',F.subj)}${inp('ntp','Topic or chapter','text','data-ent="#atp"')}<button class="btn" id="atp" data-a="addtopic">Add</button></div>
<ul>${S.topics.filter(t=>t.s===F.subj).map(t=>`<li class="it ${t.done?'done':''}"><button class="chk" data-a="ttog" data-id="${t.id}" aria-label="Toggle ${esc(t.n)}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span class="tt">${esc(t.n)}</span><button class="x" data-a="tdel" data-id="${t.id}">×</button></li>`).join('')||'<li class="mt">No topics for this subject yet.</li>'}</ul></div>
${parkCard()}<div class="card"><div class="cal">Today’s sessions</div><p class="hint">Every focus session you have finished today.</p><ul>${td.map(x=>`<li class="it"><span class="tt">${esc(x.s)}${x.tn?' · '+esc(x.tn):''}</span><span class="mt">${x.m} min${x.x?' · '+x.x+' slips':''}</span></li>`).join('')||'<li class="mt">No sessions yet today.</li>'}</ul></div></div>`}

function vWeek(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+wk*7);const ds=[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x});
return `<h2>Week plan</h2><div class="row" style="margin:6px 0 16px"><button class="chip" data-a="wk" data-d="-1">‹ Prev</button><span class="mt">${ds[0].toLocaleDateString('en-US',{day:'numeric',month:'short'})} – ${ds[6].toLocaleDateString('en-US',{day:'numeric',month:'short'})}</span><button class="chip" data-a="wk" data-d="1">Next ›</button></div>
<div class="two">${ds.map(x=>{const k=dk(x),l=S.tasks.filter(t=>t.d===k);return `<div class="card" ${k===T?'style="border-color:var(--a)"':''}><div class="cal">${x.toLocaleDateString('en-US',{weekday:'long'})} <span class="mt" style="font-family:'DM Sans';font-size:.8rem">${x.getDate()}/${x.getMonth()+1}</span></div>${l.length?`<ul>${l.map(tk).join('')}</ul>`:''}<input class="g" style="width:100%;margin-top:8px" data-day="${k}" placeholder="Add task, press Enter" maxlength=120></div>`}).join('')}</div>`}

function vMoney(){const l=S.exp.filter(x=>x.d===ed),tot=sum(l.map(x=>x.a)),ms=expSum(ed.slice(0,7)),by={};S.exp.filter(x=>x.d.startsWith(ed.slice(0,7))).forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
return `<h2>Money</h2><p class="sub">Log what you spend. The day total updates as you go.</p>
<div class="grid"><div class="stat"><b class="${S.budget&&tot>S.budget?'warn':''}">${M(tot)}</b><span>spent on ${ed===T?'today':ed}</span></div><div class="stat"><b>${M(ms)}</b><span>this month</span></div><div class="stat"><b>${S.budget?M(S.budget):'Not set'}</b><span>daily budget</span></div></div>
<div class="card"><div class="row"><input type="date" id="ed" value="${ed}" data-ch="ed">${inp('ea','Amount','number','min=0 data-ent="#ae"')}<select id="ec">${EC.map(c=>`<option>${c}</option>`).join('')}</select>${inp('en','Note (optional)','text','data-ent="#ae"')}<button class="btn" id="ae" data-a="aexp">Add expense</button></div>
<div class="row" style="margin-top:10px"><span class="mt">Daily budget</span><input id="bg" type="number" min=0 value="${S.budget||''}" style="width:110px" data-ent="#sb"><button class="chip" id="sb" data-a="budget">Save</button></div>
${S.budget&&tot>S.budget?`<p class="warn">You’re ${M(tot-S.budget)} over today’s budget.</p>`:''}</div>
<div class="two"><div class="card"><div class="cal">Entries</div><ul>${l.map(x=>`<li class="it"><span class="tt">${esc(x.n||x.c)}</span><span class="tag">${x.c}</span><b>${M(x.a)}</b><button class="x" data-a="xdel" data-id="${x.id}">×</button></li>`).join('')||'<li class="mt">Nothing logged for this day.</li>'}</ul></div>

const cells=[...Array(off)].map(()=>'<i></i>').concat(per.map((v,i)=>`<i style="background:color-mix(in srgb,var(--a) ${v?28+v/mx*72:0}%,var(--s2))" title="Day ${i+1}: ${v} min"></i>`)).join('');
const r=(a,b)=>`<div class="rw"><span style="width:130px">${a}</span><b>${b}</b></div>`;
return `<div class="two"><div class="card"><div class="cal">Consistency map</div><div class="heat" role="img" aria-label="Study heatmap">${cells}</div><p class="mt">Darker squares mean more study that day.</p></div><div class="card"><div class="cal">Insights</div>${r('Vs last month',diff===null?'No data yet':(diff>=0?'▲ ':'▼ ')+Math.abs(diff)+'%')}${r('Best day',cur?'Day '+(best+1)+' · '+H(mx):'None yet')}${r('Longest streak',lng+' days')}${r('Clean sessions',clean+'%')}</div></div>`}
/* lock-in layer */
let AW=0;const OT=document.title;
function buzz(){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(110,t+.4);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.55)}catch(e){}}
function voided(){clearInterval(tm);F.run=false;noise(false);document.title=OT;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}$('#ov').innerHTML=`<div><div class="cal" style="font-size:3rem">Session voided</div><p class="mt">Three strikes, so no XP this time. Breathe, reset, and try again.</p><button class="btn" data-a="close">Back</button></div>`}
function parkCard(){return `<div class="card"><div class="cal">Parking lot</div><p class="mt">Random thoughts you parked while focusing. Check them on your break.</p><ul>${(S.park||[]).map(x=>`<li class="it"><span class="tt">${esc(x.t)}</span><span class="mt">${x.d}</span><button class="x" data-a="pdel" data-id="${x.id}" aria-label="Delete">×</button></li>`).join('')||'<li class="mt">Empty. Nothing is pulling you away.</li>'}</ul></div>`}
document.addEventListener('visibilitychange',()=>{if(!F.run)return;if(document.hidden){if(!AW)AW=Date.now();document.title='👀 Come back and study!'}else document.title=OT});
window.addEventListener('blur',()=>{if(F.run&&!AW)AW=Date.now()});
window.addEventListener('focus',()=>{if(!away)AW=0});
/* events */
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();return}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,m=b.dataset.m,d=+b.dataset.d;
const F1=()=>{save();render()};
if(a==='add'){const t=v('nt').trim();if(t){S.tasks.push({id:uid(),t,d:T,s:v('ns')==='General'?'':v('ns'),done:false});F1()}}
else if(a==='tog'){const t=S.tasks.find(t=>t.id===id);t.done=!t.done;if(t.done){burst(b);award(10,'task done')}else S.xp=Math.max(0,S.xp-10);F1()}
else if(a==='del'){S.tasks=S.tasks.filter(t=>t.id!==id);F1()}
else if(a==='carry'){S.tasks.forEach(t=>{if(t.d<T&&!t.done)t.d=T});F1()}
else if(a==='wk'){wk+=d;render()}else if(a==='mo'){const[y,mm]=mo.split('-').map(Number),x=new Date(y,mm-1+d);mo=x.getFullYear()+'-'+P(x.getMonth()+1);render()}
else if(a==='mins'){F.mins=+m;render()}else if(a==='cmins'){const n=+v('cm');if(n>0){F.mins=Math.min(300,n);render()}}
else if(a==='addsub'){const s=v('nsub').trim();if(s&&!S.subs.includes(s)){S.subs.push(s);F.subj=s;F1()}}
else if(a==='addtopic'){const n=v('ntp').trim();if(n){S.topics.push({id:uid(),s:v('tsb'),n,done:false});F.subj=v('tsb');F1()}}
else if(a==='ttog'){const t=S.topics.find(t=>t.id===id);t.done=!t.done;t.dd=t.done?T:'';if(t.done){burst(b);award(25,'topic complete')}F1()}else if(a==='tdel'){S.topics=S.topics.filter(t=>t.id!==id);F1()}
else if(a==='pledge')pledge();else if(a==='go')begin();else if(a==='close'){$('#ov').className='';render()}
else if(a==='finish')done();else if(a==='park'){const t=v('pk').trim();if(t){S.park=S.park||[];S.park.push({id:uid(),t,d:T});save();$('#pk').value='';toast('Parked. Back to work!')}}else if(a==='pdel'){S.park=(S.park||[]).filter(x=>x.id!==id);F1()}else if(a==='brk')brk(+m);else if(a==='bend')bend(false);else if(a==='snd'){noise(!NZ);b.textContent=NZ?'🎧 Sound on':'🎧 Calm sound'}else if(a==='quit'){if(!b._c){b._c=1;b.textContent='Really give up? Tap again';setTimeout(()=>{b._c=0;b.textContent='Give up'},4000);return}try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}noise(false);clearInterval(tm);F.run=false;$('#ov').className='';render()}
else if(a==='aexp'){const n=+v('ea');if(n>0){S.exp.push({id:uid(),d:ed,a:n,c:v('ec'),n:v('en').trim()});award(2,'expense logged');F1()}}
else if(a==='xdel'){S.exp=S.exp.filter(x=>x.id!==id);F1()}else if(a==='budget'){S.budget=+v('bg')||0;F1()}
else if(a==='atrip'){if(v('tp').trim()){S.trips.push({id:uid(),p:v('tp').trim(),d:v('td')||T,n:v('tn').trim()});award(8,'memory saved');F1()}}else if(a==='trdel'){S.trips=S.trips.filter(x=>x.id!==id);F1()}
else if(a==='aapp'){if(v('ao').trim()){S.apps.push({id:uid(),o:v('ao').trim(),r:v('ar').trim()||'Role',d:v('ad')||T,st:'Applied'});award(8,'application tracked');F1()}}else if(a==='apdel'){S.apps=S.apps.filter(x=>x.id!==id);F1()}
else if(a==='theme'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';applyPal()}else if(a==='pal'){S.pal=m;F1()}else if(a==='mood'){S.mood=S.mood||{};S.mood[T]=m;F1()}else if(a==='hab'){const h=S.habits.find(x=>x.id===id);h.days[m]=!h.days[m];if(h.days[m]){burst(b);award(3,'habit done')}F1()}else if(a==='hdel'){S.habits=S.habits.filter(x=>x.id!==id);F1()}else if(a==='ah'){const n=v('nh').trim();if(n){S.habits.push({id:uid(),n,days:{}});F1()}}else if(a==='aex'){const n=v('en2').trim();if(n){S.exams.push({id:uid(),n,d:v('ed2')||T});F1()}}else if(a==='exdel'){S.exams=S.exams.filter(x=>x.id!==id);F1()}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.ch;if(!c)return;
if(t.classList.contains('pl')){}
if(c==='fs'||c==='tsb'){F.subj=t.value;F.topic='';render()}else if(c==='ft')F.topic=t.value;else if(c==='md')F.markDone=t.checked;else if(c==='sm'){S.strict=t.checked;save()}
else if(c==='gl'){S.goal=Math.max(10,+t.value||60);save();render()}else if(c==='ed'){ed=t.value||T;render()}else if(c==='apst'){S.apps.find(x=>x.id===t.dataset.id).st=t.value;save();render()}});
document.addEventListener('change',e=>{if(e.target.classList.contains('pl')){const g=$('#go');if(g)g.disabled=![...document.querySelectorAll('.pl')].every(x=>x.checked)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
if(t.dataset.ent){$(t.dataset.ent).click();return}
if(t.dataset.day&&t.value.trim()){S.tasks.push({id:uid(),t:t.value.trim(),d:t.dataset.day,s:'',done:false});save();const k=t.dataset.day;render();document.querySelector(`[data-day="${k}"]`).focus()}});
render();
</script></body></html>
